plugins {
    id 'java'
}

group = 'com.togsyn.tech'
version = '1.0.0'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
}

// Must match the Keycloak server version the jar will run on.
def kc = '26.6.3'

dependencies {
    compileOnly "org.keycloak:keycloak-server-spi:${kc}"
    compileOnly "org.keycloak:keycloak-server-spi-private:${kc}"
    compileOnly "org.keycloak:keycloak-services:${kc}"
    compileOnly "org.keycloak:keycloak-core:${kc}"
    compileOnly "org.keycloak:keycloak-common:${kc}"

    implementation 'commons-codec:commons-codec:1.17.1'

    compileOnly 'jakarta.ws.rs:jakarta.ws.rs-api:3.1.0'
}

jar {
    archiveFileName = 'togsyn-mfa-spi.jar'
}